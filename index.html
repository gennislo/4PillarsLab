    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;

      max-width: 520px;
      width: 100%;
      padding: 28px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;

    }
    p.subtitle {
      font-size: 0.88rem;
      color: #6e6e73;
      margin-bottom: 16px;
    }
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .mode-btn {
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #dcdce1;
      background: #f8f9fa;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #495057;
    }
    .mode-btn.active {
      background-color: #0071e3;
      color: white;
      border-color: #0071e3;
    }
    .question-box {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .prompt-text {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 0.88rem;
      color: #86868b;
    }
    .options-grid {

      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    button.option-btn {
      background-color: #ffffff;
      border: 2px solid #dcdce1;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #333;
    }
    button.option-btn:hover {
      border-color: #0071e3;
      background-color: #f0f7ff;
    }
    .feedback {
      min-height: 28px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .correct { color: #2e7d32; }
    .incorrect { color: #c62828; }
    
    .score-board {
      font-size: 0.85rem;
      color: #515154;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #e5e5ea;
      padding-top: 16px;
    }
    button.action-btn {
      width: 100%;
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      display: none;

      background: #f8f9fa;
      padding: 16px;

    { prompt: "辛金日干 遇 酉", answer: "辛比肩", label: "辛金遇酉藏辛，為【辛比肩】", options: ["辛比肩", "庚劫財", "癸食神", "己偏印"] },
    { prompt: "辛金日干 遇 申", answer: "庚劫財", label: "辛金遇申藏庚，為【庚劫財】", options: ["辛比肩", "庚劫財", "壬傷官", "戊正印"] },
    { prompt: "辛金日干 遇 亥子", answer: "癸壬食傷", label: "辛金遇亥子藏癸壬，為【癸壬食傷】", options: ["癸壬食傷", "乙甲財星", "丁丙官殺", "己戊印星"] },
    { prompt: "辛金日干 遇 寅卯", answer: "乙甲財星", label: "辛金遇寅卯藏乙甲，為【乙甲財星】", options: ["癸壬食傷", "乙甲財星", "丁丙官殺", "己戊印星"] },
    { prompt: "辛金日干 遇 巳午", answer: "丁丙官殺", label: "辛金遇巳午藏丁丙，為【丁丙官殺】", options: ["癸壬食傷", "乙甲財星", "丁丙官殺", "己戊印星"] },
    { prompt: "辛金日干 遇 辰戌丑未", answer: "己戊印星", label: "辛金遇辰戌丑未藏己戊，為【己戊印星】", options: ["癸壬食傷", "乙甲財星", "丁丙官殺", "己戊印星"] },

    { prompt: "壬水日干 遇 亥", answer: "壬比肩", label: "壬水遇亥藏壬，為【壬比肩】", options: ["壬比肩", "癸劫財", "甲食神", "庚偏印"] },
    { prompt: "壬水日干 遇 子", answer: "癸劫財", label: "壬水遇子藏癸，為【癸劫財】", options: ["壬比肩", "癸劫財", "乙傷官", "辛正印"] },
    { prompt: "壬水日干 遇 寅卯", answer: "甲乙食傷", label: "壬水遇寅卯藏甲乙，為【甲乙食傷】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] },
    { prompt: "壬水日干 遇 巳午", answer: "丙丁財星", label: "壬水遇巳午藏丙丁，為【丙丁財星】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] },
    { prompt: "壬水日干 遇 辰戌丑未", answer: "戊己官殺", label: "壬水遇辰戌丑未藏戊己，為【戊己官殺】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] },
    { prompt: "壬水日干 遇 申酉", answer: "申酉印星", label: "壬水遇申酉藏庚辛，為【申酉印星】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] }
  ];

  let activeData = liuheData;
  let currentQuestion = null;
  let currentStep = 1;
  let score = 0;
  let answered = false;
  let wrongHistory = [];

  function switchCategory(cat) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (cat === 'liuhe') { activeData = liuheData; document.getElementById('m1').classList.add('active'); }
    if (cat === 'liuchong') { activeData = liuchongData; document.getElementById('m2').classList.add('active'); }
    if (cat === 'sanhe') { activeData = sanheData; document.getElementById('m3').classList.add('active'); }
    if (cat === 'sanhui') { activeData = sanhuiData; document.getElementById('m4').classList.add('active'); }
    if (cat === 'tengods') { activeData = tengodsData; document.getElementById('m5').classList.add('active'); }
    
    restartRound();
  }

  function restartRound() {
    currentStep = 1;
    score = 0;
    wrongHistory = [];
    document.getElementById("quizContent").style.display = "block";
    document.getElementById("summaryArea").style.display = "none";
    document.getElementById("scoreCount").innerText = score;
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    document.getElementById("feedback").innerText = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("actionBtn").style.display = "none";
    document.getElementById("currentNum").innerText = currentStep;

    const randomIndex = Math.floor(Math.random() * activeData.length);
    currentQuestion = activeData[randomIndex];

    document.getElementById("promptDisplay").innerText = currentQuestion.prompt;
    document.getElementById("hintDisplay").innerText = currentQuestion.hint || "請選擇對應的正確答案：";

    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";

    currentQuestion.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(opt, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(selectedOption, btnElement) {
    if (answered) return;
    answered = true;

    const feedbackEl = document.getElementById("feedback");
    const optionBtns = document.querySelectorAll(".option-btn");
    optionBtns.forEach(btn => btn.style.pointerEvents = "none");

    if (selectedOption === currentQuestion.answer) {
      score++;
      feedbackEl.innerText = `答對了！ ${currentQuestion.label}`;
      feedbackEl.className = "feedback correct";
      btnElement.style.backgroundColor = "#e8f5e9";
      btnElement.style.borderColor = "#2e7d32";
    } else {
      wrongHistory.push({ question: currentQuestion.prompt, selected: selectedOption, correct: currentQuestion.label });
      feedbackEl.innerText = `不正確。 ${currentQuestion.label}`;
      feedbackEl.className = "feedback incorrect";
      btnElement.style.backgroundColor = "#ffebee";
      btnElement.style.borderColor = "#c62828";
    }

    document.getElementById("scoreCount").innerText = score;
    document.getElementById("actionBtn").style.display = "block";
    document.getElementById("actionBtn").innerText = currentStep < 10 ? "下一題" : "查看本輪成績";
  }

  function handleAction() {
    if (currentStep < 10) {
      currentStep++;
      loadQuestion();
    } else {
      showSummary();
    }
  }

  function showSummary() {
    document.getElementById("quizContent").style.display = "none";
    document.getElementById("summaryArea").style.display = "block";

    let html = `<h3>本輪測驗結束！</h3>`;
    html += `<p>得分：<strong>${score}</strong> / 10</p><br>`;

    if (wrongHistory.length === 0) {
      html += `<p style="color: #2e7d32; font-weight: bold;">太棒了！本輪完全正確！</p>`;
    } else {
      html += `<p style="font-weight: bold; color: #c62828;">錯題檢討：</p><ul>`;
      wrongHistory.forEach(item => {
        html += `<li><strong>${item.question}</strong>：你選了「${item.selected}」，正確解答為【${item.correct}】</li>`;
      });
      html += `</ul>`;
    }

    document.getElementById("summaryContent").innerHTML = html;
  }

  // Initialize on load
  loadQuestion();
</script>

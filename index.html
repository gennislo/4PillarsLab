    { prompt: "壬水日干 遇 辰戌丑未", answer: "戊己官殺", label: "壬水遇辰戌丑未地支本氣藏戊己，為【戊己官殺】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] },
    { prompt: "壬水日干 遇 申酉", answer: "申酉印星", label: "壬水遇申酉地支本氣藏庚辛，為【申酉印星】", options: ["甲乙食傷", "丙丁財星", "戊己官殺", "申酉印星"] }
  ];

  let currentMode = 'combinations'; // 'combinations' or 'tenGods'
  let activeDataSet = branchCombinations;
  let currentQuestion = null;
  let score = 0;
  let total = 0;
  let answered = false;

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById("mode1Btn").classList.toggle("active", mode === 'combinations');
    document.getElementById("mode2Btn").classList.toggle("active", mode === 'tenGods');
    
    activeDataSet = (mode === 'combinations') ? branchCombinations : tenGodsQuestions;
    score = 0;
    total = 0;
    document.getElementById("scoreCount").innerText = score;
    document.getElementById("totalCount").innerText = total;
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    document.getElementById("feedback").innerText = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("nextBtn").style.display = "none";

    // Random selection
    const randomIndex = Math.floor(Math.random() * activeDataSet.length);
    currentQuestion = activeDataSet[randomIndex];

    document.getElementById("promptDisplay").innerText = currentQuestion.prompt;
    document.getElementById("hintDisplay").innerText = currentQuestion.hint || "根據日干與地支，對照其本氣十神：";

    // Render option buttons
    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";

    currentQuestion.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(opt, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(selectedOption, btnElement) {
    if (answered) return;
    answered = true;
    total++;

    const feedbackEl = document.getElementById("feedback");
    const optionBtns = document.querySelectorAll(".option-btn");

    optionBtns.forEach(btn => btn.style.pointerEvents = "none");

    if (selectedOption === currentQuestion.answer) {
      score++;
      feedbackEl.innerText = `答對了！ ${currentQuestion.label}`;
      feedbackEl.className = "feedback correct";
      btnElement.style.backgroundColor = "#e8f5e9";
      btnElement.style.borderColor = "#2e7d32";
    } else {
      feedbackEl.innerText = `不正確。 ${currentQuestion.label}`;
      feedbackEl.className = "feedback incorrect";
      btnElement.style.backgroundColor = "#ffebee";
      btnElement.style.borderColor = "#c62828";
    }

    document.getElementById("scoreCount").innerText = score;
    document.getElementById("totalCount").innerText = total;
    document.getElementById("nextBtn").style.display = "block";
  }

  function nextQuestion() {
    loadQuestion();
  }

  // Initial setup
  loadQuestion();
</script>

</body>
</html>
